name: Build AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o elevate.zip && rm elevate.zip
      - name: Fix Navbar import
        run: |
          sed -i 's/import { ElevateLogo }/import ElevateLogo/' src/components/Navbar.tsx
          sed -i 's/import {ElevateLogo}/import ElevateLogo/' src/components/Navbar.tsx
          cat src/components/Navbar.tsx | head -n 30
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build
      - run: npx cap init Elevate com.elevate.app --web-dir=dist --npm-client npm
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew &&./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: elevate-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

name: Build AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o elevate.zip && rm elevate.zip
      - name: Fix ElevateLogo export bug
        run: |
          echo "Fixing Navbar import..."
          sed -i 's/import { ElevateLogo }/import ElevateLogo/g' src/components/Navbar.tsx || true
          sed -i 's/import {ElevateLogo}/import ElevateLogo/g' src/components/Navbar.tsx || true
          # Also make ElevateLogo export both ways to be safe
          grep -q "export { ElevateLogo }" src/components/ElevateLogo.tsx || echo "export { default as ElevateLogo } from './ElevateLogo';" >> src/components/ElevateLogo.tsx || true
          grep -q "export const ElevateLogo" src/components/ElevateLogo.tsx || echo "export const ElevateLogo = (await import('./ElevateLogo')).default;" >> src/components/ElevateLogo.tsx || true
          cat src/components/Navbar.tsx | grep ElevateLogo
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build
      - run: npx cap init Elevate com.elevate.app --web-dir=dist --npm-client npm
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew &&./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: elevate-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

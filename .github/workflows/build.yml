name: Build AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and arrange project
        run: |
          unzip -o elevate.zip
          rm elevate.zip
          # If project is inside a subfolder, move it to root
          if [ -f elevate/package.json ]; then mv elevate/*.; mv elevate/.*. 2>/dev/null || true; fi
          ls -la
          cat package.json || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and Build Web
        run: |
          npm install
          npm run build

      - name: Setup Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Elevate com.elevate.app --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Build AAB
        run: |
          cd android
          chmod +x gradlew
        ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: elevate-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
